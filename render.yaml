# Render Blueprint: render.com → New → Blueprint → pick this repo.
services:
  - type: web
    name: drona-deck-didac
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Simulator, code map and tap-log pages are hidden. Set to "true" only for local testing.
      - key: DEV_TOOLS
        value: "false"
      # Leave BASE_URL unset to use the Render URL. Set it once you have the final domain for the tags.
