# Render Blueprint: render.com → New → Blueprint → pick this repo.
services:
  - type: web
    name: drona-deck-didac
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Simulator, code map and tap-log pages are hidden. Set to "true" only for local testing.
      - key: DEV_TOOLS
        value: "false"
      # Leave BASE_URL unset to use the Render URL. Set it once you have the final domain for the tags.
      # Outgoing mail for the complete report (Microsoft 365: smtp.office365.com, port 587). Fill these in the Render dashboard (they are secrets).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
