# Render Blueprint: render.com → New → Blueprint → pick this repo.
services:
  - type: web
    name: drona-deck-didac
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Keep the simulator, code map and tap log on while testing. Set to "false" for the booth.
      - key: DEV_TOOLS
        value: "true"
      # Leave BASE_URL unset to use the Render URL. Set it once you have the final domain for the tags.
